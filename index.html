<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedroom render</title>
<meta name="description" content="Interactive 3D plan of the bedroom makeover: anime display wall, framed 48 inch OLED, mirror wardrobe, desk and bed.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1b1420;color:#f1eff4;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;padding:14px 16px calc(14px) 16px;pointer-events:none}
  header h1{font-size:17px;font-weight:500}
  header p{font-size:13px;color:#b9b1c4;margin-top:2px}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(20,14,26,.9) 35%)}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button{font:inherit;font-size:13px;color:#f1eff4;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 11px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.14)}
  button.on{background:#f1eff4;color:#1b1420}
  .lbl{font-size:13px;color:#b9b1c4;margin:0 2px 0 6px}
  #gap{font-size:13px;color:#b9b1c4}
</style>
</head>
<body>
<div id="app"></div>
<header>
  <h1>Bedroom render</h1>
  <p>Drag to orbit · pinch or scroll to zoom · all measurements in cm</p>
</header>
<div id="ui">
  <div class="row">
    <button data-view="top" class="on">Top down</button>
    <button data-view="bed">From the bed</button>
    <button data-view="bay">Bay window</button>
    <button data-view="back">Desk and bed wall</button>
    <button data-view="door">From the door</button>
  </div>
  <div class="row">
    <button id="tLab" class="on">Measurements</button>
    <span class="lbl">Bed</span>
    <button data-bed="double" class="on">Double 135×190</button>
    <button data-bed="king">King 150×200</button>
  </div>
  <p id="gap"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Room dimensions in cm. x runs along the shelf wall (0 = window corner), z runs from the shelf wall towards the desk wall.
const W = 370, H = 240, D = 345;
let bed = 'double', showLab = true;

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1420);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
app.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(62, 1, 1, 3000);
const ctr = new THREE.OrbitControls(cam, renderer.domElement);
ctr.enableDamping = true;

scene.add(new THREE.AmbientLight(0x8a6aa0, 0.6));
const pink = new THREE.PointLight(0xd070e0, 0.7, 700);
pink.position.set(0, 230, 0);
scene.add(pink);

const G = new THREE.Group(), LB = new THREE.Group();
scene.add(G); scene.add(LB);

const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8 }, o || {}));

// Axis-aligned box from its min corner (room coordinates, cm)
function B(x, y, z, w, h, d, c, o) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, o));
  m.position.set(x + w / 2 - W / 2, y + h / 2, z + d / 2 - D / 2);
  G.add(m); return m;
}
// Box stretched between two floor points (for the curved bay)
function S(x1, z1, x2, z2, y, h, t, c, o) {
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, t), mat(c, o));
  m.position.set((x1 + x2) / 2 - W / 2, y + h / 2, (z1 + z2) / 2 - D / 2);
  m.rotation.y = -Math.atan2(dz, dx);
  G.add(m); return m;
}
function L(x, y, z, c, i, r) {
  const p = new THREE.PointLight(c, i, r || 140);
  p.position.set(x - W / 2, y, z - D / 2); G.add(p);
}
// Measurement label sprite
function T(txt, x, y, z) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 40;
  g.font = '500 ' + fs + 'px sans-serif';
  const tw = Math.ceil(g.measureText(txt).width) + 36;
  c.width = tw; c.height = 64;
  g.font = '500 ' + fs + 'px sans-serif';
  g.fillStyle = 'rgba(20,16,24,0.82)';
  const r = 14;
  g.beginPath(); g.moveTo(r, 0); g.lineTo(tw - r, 0); g.quadraticCurveTo(tw, 0, tw, r); g.lineTo(tw, 64 - r);
  g.quadraticCurveTo(tw, 64, tw - r, 64); g.lineTo(r, 64); g.quadraticCurveTo(0, 64, 0, 64 - r); g.lineTo(0, r);
  g.quadraticCurveTo(0, 0, r, 0); g.fill();
  g.fillStyle = '#ffffff'; g.textBaseline = 'middle'; g.fillText(txt, 18, 34);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.renderOrder = 10; s.scale.set(9 * tw / 64, 9, 1);
  s.position.set(x - W / 2, y, z - D / 2); LB.add(s);
}

const BLK = 0x1e1a1c, WALL = 0x4a3550, WHITE = 0xeeeaf2;
const pastel = [0xf2c6de, 0xc6d8f2, 0xf7e1a8, 0xd9c6f2, 0xffffff, 0xb8e0d2];
const fig = (x, y, z, k) => { B(x - 4, y, z - 4, 8, 4, 8, 0x111111); B(x - 3, y + 4, z - 3, 6, 14 + (k % 3) * 4, 6, pastel[k % 6]); };
const manga = (x, y, w) => { for (let i = 0; i < w / 2.2; i++) B(x + i * 2.2, y, 6, 2, 17, 12, pastel[(i * 7) % 6]); };
const puck = (x, y) => B(x - 2, y - 1, 10, 4, 1, 4, 0xffe0a0, { emissive: 0xffc070, emissiveIntensity: 1 });
const shelves = (x0, w, ys) => ys.forEach(y => B(x0, y, 0, w, 2, 28, BLK));
function katana(y) {
  B(28, y, D - 9, 92, 2.4, 2.6, 0x0c0c0c, { roughness: 0.35 });
  B(120, y - 0.6, D - 10, 2, 3.6, 4, 0xb08a3a, { metalness: 0.6, roughness: 0.4 });
  B(122, y, D - 9, 28, 2.6, 2.6, 0x5a1222);
  for (let i = 0; i < 6; i++) B(124 + i * 4.5, y - 0.1, D - 9.2, 1.2, 2.8, 3, 0x0c0c0c);
}

// Curved bay: five window panels on a half-ellipse
function bay() {
  const z0 = 25, z1 = D - 60, zc = (z0 + z1) / 2, a = (z1 - z0) / 2, b = 55, N = 5, pts = [];
  for (let i = 0; i <= N; i++) { const t = -Math.PI / 2 + Math.PI * i / N; pts.push([-b * Math.cos(t), zc + a * Math.sin(t)]); }
  B(-b - 4, -1, z0, b + 4, 1, z1 - z0, 0x7a5466);
  for (let i = 0; i < N; i++) {
    const [p, q] = [pts[i], pts[i + 1]];
    S(p[0], p[1], q[0], q[1], 0, 86, 6, WALL);
    S(p[0] * 0.97, zc + (p[1] - zc) * 0.985, q[0] * 0.97, zc + (q[1] - zc) * 0.985, 0, 15, 1.5, WHITE);
    S(p[0], p[1], q[0], q[1], 86, 4, 14, WHITE);
    S(p[0], p[1], q[0], q[1], 90, 112, 1, 0x8fb3d9, { emissive: 0x1c2a44, transparent: true, opacity: 0.85 });
    S(p[0], p[1], q[0], q[1], 168, 3, 5, WHITE);
    S(p[0], p[1], q[0], q[1], 202, 5, 6, WHITE);
    S(p[0], p[1], q[0], q[1], 207, 33, 6, WALL);
    B(p[0] - 2.5, 90, p[1] - 2.5, 5, 112, 5, WHITE);
  }
  B(pts[N][0] - 2.5, 90, pts[N][1] - 2.5, 5, 112, 5, WHITE);
  B(-b, 234, z0, b, 6, z1 - z0, 0x3a2a44);
  const inset = (p, k) => [p[0] * k, zc + (p[1] - zc) * k];
  [[0, 1], [N - 1, N]].forEach(([i, j]) => { const p = inset(pts[i], 0.88), q = inset(pts[j], 0.88); S(p[0], p[1], q[0], q[1], 4, 226, 9, 0x3d3646); });
  L(-30, 150, zc, 0x9fb8e8, 0.25, 220);
  T('Bay ~260 wide × 55 deep', -30, 215, zc);
  T('Sill 86 high', -40, 95, zc);
}

function build() {
  while (G.children.length) G.remove(G.children[0]);
  while (LB.children.length) LB.remove(LB.children[0]);

  // Floor, walls, skirting
  B(0, -1, 0, W, 1, D, 0x7a5466);
  B(0, 0, -2, W, H, 2, WALL);
  B(W, 0, 0, 2, H, D, WALL, { transparent: true, opacity: 0.35 });
  B(0, 0, D, W, H, 2, WALL);
  B(-2, 0, 0, 2, H, 25, WALL); B(-2, 0, D - 60, 2, H, 60, WALL);
  B(0, 0, 0, W, 15, 1.5, WHITE); B(W - 1.5, 0, 0, 1.5, 15, D, WHITE); B(0, 0, D - 1.5, W, 15, 1.5, WHITE);
  B(0, 0, 0, 1.5, 15, 25, WHITE); B(0, 0, D - 60, 1.5, 15, 60, WHITE);
  bay();

  // Mirror wardrobe (window corner)
  B(0, 0, 0, 100, 236, 58, BLK);
  B(3, 4, 58, 46, 228, 0.6, 0xb4b4c4, { metalness: 0.6, roughness: 0.15 });
  B(51, 4, 58, 46, 228, 0.6, 0xb4b4c4, { metalness: 0.6, roughness: 0.15 });

  // TV section with shelves above and below
  B(100, 0, 0, 130, 237, 1, 0x241e22); B(100, 0, 0, 2, 237, 28, BLK); B(228, 0, 0, 2, 237, 28, BLK);
  shelves(100, 130, [0, 6, 39, 72, 157, 196, 235]);
  B(164, 6, 0, 2, 66, 28, BLK); B(164, 157, 0, 2, 78, 28, BLK);
  fig(132, 41, 14, 1); manga(170, 41, 50); fig(132, 8, 14, 3); fig(196, 8, 14, 4);
  fig(132, 159, 14, 2); fig(196, 159, 14, 5); manga(106, 198, 50); fig(196, 198, 14, 0);
  [132, 196].forEach(x => [37, 70, 194, 233].forEach(y => puck(x, y)));
  B(116, 88, 1.5, 98, 52, 0.5, 0xffb070, { emissive: 0xff9a50, emissiveIntensity: 0.7 });
  B(111.5, 83, 4, 107, 62, 2.5, 0x050505, { roughness: 0.25 });

  // Figure tower (door end)
  const ty = [0, 6, 39, 72, 105, 138, 171, 204, 235];
  B(230, 0, 0, 40, 237, 1, 0x241e22); B(230, 0, 0, 2, 237, 28, BLK); B(268, 0, 0, 2, 237, 28, BLK);
  shelves(230, 40, ty);
  ty.slice(1, 8).forEach((y, i) => { fig(250, y + 2, 14, i); puck(250, ty[i + 2] - 0.5); });
  L(250, 200, 30, 0xffc080, 0.6); L(250, 90, 30, 0xffc080, 0.6); L(165, 215, 30, 0xffc080, 0.6); L(165, 55, 30, 0xffc080, 0.6);

  // Door, open at 90°
  B(273, 0, 0, 4, 207, 6, WHITE); B(355, 0, 0, 4, 207, 6, WHITE); B(273, 203, 0, 86, 6, 6, WHITE);
  B(277, 0, 0.5, 78, 203, 0.5, 0x150f18);
  B(277, 0, 6, 4, 200, 78, 0xf2f2f2);

  // Desk and katana rack
  B(0, 74, D - 70, 180, 3, 70, 0x111111);
  [[2, D - 68], [175, D - 68], [2, D - 5], [175, D - 5]].forEach(p => B(p[0], 0, p[1], 3, 74, 3, 0x111111));
  B(60, 85, D - 18, 60, 35, 3, 0x050505, { emissive: 0x101828 });
  B(45, 168, D - 6, 4, 34, 6, 0x111111); B(105, 168, D - 6, 4, 34, 6, 0x111111);
  katana(192); katana(177);
  L(90, 150, D - 60, 0xffc8a0, 0.35, 160);

  // Bed, canvases, radiator
  const bw = bed === 'king' ? 150 : 135, bl = bed === 'king' ? 200 : 190, bx = 190, cx = bx + bw / 2, foot = D - bl;
  B(bx, 0, foot, bw, 30, bl, 0x1a1a1a); B(bx + 2, 30, foot + 2, bw - 4, 22, bl - 6, 0xd8d0e0); B(bx, 0, D - 6, bw, 105, 6, 0x1a1a1a);
  B(bx + 10, 52, D - 45, bw / 2 - 15, 10, 32, 0xf4eef8); B(bx + bw / 2 + 5, 52, D - 45, bw / 2 - 15, 10, 32, 0xf4eef8);
  B(bx + 2, 52, foot + 4, bw - 4, 4, bl - 60, 0x6a4a7a);
  const cw = 40, ch = 55, gp = 8, cols = [[0x2b2f5a, 0xe06a8a], [0x1f1f2e, 0xf2c6de], [0x3a2550, 0x8fb3d9]];
  [-1, 0, 1].forEach((k, i) => {
    const x = cx - cw / 2 + k * (cw + gp);
    B(x, 122, D - 4, cw, ch, 4, cols[i][0]);
    B(x + 8, 138, D - 4.6, cw - 16, ch - 30, 0.4, cols[i][1], { emissive: cols[i][1], emissiveIntensity: 0.15 });
  });
  L(cx, 170, D - 50, 0xffd0b0, 0.3, 160);
  B(W - 11, 18, foot, 9, 60, 100, 0xf2f2f2);
  for (let i = 0; i < 12; i++) B(W - 12, 20, foot + 4 + i * 8, 1, 56, 4, 0xdddddd);

  // Labels (cm)
  const side = W - (bx + bw);
  T('Room 370 × 345, ceiling 240', W / 2, 262, D / 2);
  T('Wardrobe 100 × 58 × 236', 50, 245, 40);
  T('TV area 130 wide', 165, 245, 20);
  T('48" OLED 107 × 62', 165, 114, 40);
  T('Opening 85 high', 165, 148, 40);
  T('Tower 40 × 28 × 237', 250, 248, 20);
  T('Door 80', 316, 215, 20);
  T('Desk 180 × 70', 90, 92, D - 50);
  T('Katana rack ~120', 90, 215, D - 20);
  T('Bed ' + bw + ' × ' + bl, cx, 70, foot + bl / 2);
  T('Canvases 40 × 55', cx, 190, D - 12);
  T('Radiator ~100', W - 30, 90, foot + 50);
  T(Math.round(side) + ' gap', bx + bw + side / 2, 40, foot + 20);
  T(Math.round(foot - 28) + ' walkway', cx, 8, (28 + foot) / 2);
  T('Skirting 15', W / 2, 22, D - 6);
  LB.visible = showLab;

  document.getElementById('gap').textContent =
    'Walkway at the foot of the bed: ' + Math.round(foot - 28) + 'cm · gap beside the bed: ' + Math.round(side) + 'cm';
}

const P = (x, y, z) => new THREE.Vector3(x - W / 2, y, z - D / 2);
const VIEWS = {
  top:  [[W / 2, 760, D / 2 + 1], [W / 2, 0, D / 2]],
  bed:  [[265, 115, D - 25], [165, 115, 0]],
  bay:  [[260, 140, 175], [-40, 130, 170]],
  back: [[170, 150, 40], [170, 140, D]],
  door: [[320, 165, 15], [110, 80, D * 0.7]],
};
function view(v) {
  cam.position.copy(P(...VIEWS[v][0])); ctr.target.copy(P(...VIEWS[v][1])); ctr.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
document.querySelectorAll('[data-bed]').forEach(b => b.onclick = () => {
  bed = b.dataset.bed; build();
  document.querySelectorAll('[data-bed]').forEach(x => x.classList.toggle('on', x === b));
});
const tl = document.getElementById('tLab');
tl.onclick = () => { showLab = !showLab; LB.visible = showLab; tl.classList.toggle('on', showLab); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize(); build(); view('top');
(function loop() { requestAnimationFrame(loop); ctr.update(); renderer.render(scene, cam); })();
</script>
</body>
</html>
